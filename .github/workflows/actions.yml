name: Build Frosty Mod Manager (Windows)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Chocolatey (if not already installed)
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))

    - name: Install Visual Studio Build Tools with required workloads
      run: |
        choco install visualstudio2022buildtools -y --package-parameters `
          "--add Microsoft.VisualStudio.Workload.ManagedDesktop `
          --add Microsoft.VisualStudio.Workload.NativeDesktop `
          --includeRecommended --includeOptional"

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '4.8.1' # Adjust this to the required .NET version for FMM

    - name: Restore dependencies
      run: dotnet restore

    - name: Build the project
      run: dotnet build --configuration Release

    - name: Run tests (if any)
      run: dotnet test

    - name: Publish the project
      run: dotnet publish -c Release -o ./publish

    - name: Archive build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frosty-mod-manager
        path: ./publish
